name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller pillow

      - name: Build EXE
        shell: cmd
        run: |
          pyinstaller --onefile --windowed --name "LAN_Chat" ^
            --hidden-import PIL --hidden-import PIL.ImageTk ^
            --hidden-import PIL.ImageGrab lan_chat_pro.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAN_Chat_Windows
          path: dist/LAN_Chat.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LAN_Chat.exe
          name: LAN Chat ${{ github.ref_name }}
          body: |
            LAN Chat - 局域网多人聊天工具

            功能：
            - 无需口令，端口 9527
            - 自动发现并连接同网段用户
            - 实时显示在线用户 IP 和用户名
            - Emoji 快捷发送
            - 图片发送
            - 表情包收藏与发送
            - 聊天记录本地保存
            - 可拖拽调整输入框大小
